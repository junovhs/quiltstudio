<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuiltStudio</title>
<style>
  :root {
    --floral: #1f4fbf; --brown: #5a2d1a; --cream: #f6ecd9; --black: #1b1b1b;
    --bg: #faf7f2; --panel: #ffffff; --ink: #2a2420; --muted: #7a6f66; --line: #e6ddd2; --accent: #1f4fbf;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 20px 24px 8px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; }
  h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  h3 { font-size: 15px; margin: 0 0 6px; }
  #summary { color: var(--muted); }
  #summary b { color: var(--ink); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px 48px; }
  .top { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 820px) { .top { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  section.panel { margin-top: 20px; }
  .field { display: grid; grid-template-columns: 1fr 78px; gap: 8px; align-items: center; margin-bottom: 10px; font-size: 13.5px; }
  .field small { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }
  input[type=number] { width: 100%; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; font: inherit; text-align: right; }
  input[type=color] { width: 100%; height: 30px; border: 1px solid var(--line); border-radius: 6px; padding: 2px; background: #fff; }
  .derived { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
  .derived div { display: flex; justify-content: space-between; }
  .derived b { color: var(--ink); font-weight: 600; }
  button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 13px; }
  .warn { background: #fff4e0; border: 1px solid #f0d29a; color: #7a4b00; border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-top: 10px; }

  /* ---------- quilt rendering ---------- */
  #mock { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .binding { width: min(100%, 720px); background: repeating-conic-gradient(var(--black) 0 25%, var(--cream) 0 50%) 0 0 / 7px 7px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
  .g { display: grid; min-width: 0; min-height: 0; }
  .c { position: relative; overflow: hidden; min-width: 0; min-height: 0; }
  .c > i { position: absolute; inset: 0; }
  .seams .leaf { box-shadow: inset 0 0 0 .5px rgba(0,0,0,.35); }
  .seams .blk { box-shadow: inset 0 0 0 1px rgba(0,0,0,.55); }
  .fab-brown { background: var(--brown); }
  .fab-cream { background: var(--cream); }
  .fab-black { background: var(--black); }
  .fab-floral {
    background:
      radial-gradient(circle at 25% 30%, #f9c3cc 0 2px, #e0475b 2.2px 3px, transparent 3.3px),
      radial-gradient(circle at 70% 72%, #ecf34f 0 2px, transparent 2.4px),
      radial-gradient(circle at 82% 22%, #ffffff 0 1.1px, transparent 1.5px),
      var(--floral);
    background-size: 17px 17px, 13px 12px, 11px 9px;
  }

  .blocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
  .blockcard .art { width: 100%; max-width: 300px; margin: 6px 0 10px; }
  .blockcard .art.wide { max-width: 100%; }
  ul.units { margin: 0; padding-left: 18px; font-size: 13.5px; }
  ul.units li { margin-bottom: 4px; }
  .tag { display: inline-block; font-size: 12px; background: #eef2fb; color: var(--accent); border-radius: 999px; padding: 1px 8px; margin-left: 6px; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
  td.n { text-align: right; white-space: nowrap; }
  .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; border: 1px solid rgba(0,0,0,.2); }
  .yard { font-size: 20px; font-weight: 650; }
  .fabgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .fabgrid .panel { padding: 12px; }

  ol.steps { padding-left: 0; list-style: none; margin: 0; counter-reset: s; }
  ol.steps li { counter-increment: s; padding: 8px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
  ol.steps li::before { content: counter(s); flex: 0 0 24px; height: 24px; border-radius: 50%; background: #eef2fb; color: var(--accent); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  ol.steps label { flex: 1; cursor: pointer; }
  ol.steps input:checked + span { color: var(--muted); text-decoration: line-through; }
  ol.steps .phase { font-weight: 650; }
</style>
</head>
<body>
<header>
  <h1>QuiltStudio</h1>
  <div id="summary"></div>
</header>

<div class="wrap">
  <div class="top">
    <aside class="panel">
      <h2>Sizes (finished, inches)</h2>
      <div id="controls"></div>
      <div class="derived" id="derived"></div>
      <h2 style="margin-top:16px">Fabric colors</h2>
      <div id="colors"></div>
      <div class="row" style="margin-top:8px"><button id="reset">Reset to defaults</button></div>
    </aside>
    <div id="mock">
      <div class="binding" id="bindingWrap"><div id="quilt"></div></div>
      <label class="muted"><input type="checkbox" id="seams" checked> Show seams</label>
      <div id="warnings" style="width:min(100%,720px)"></div>
    </div>
  </div>

  <section class="panel">
    <h2>Blocks</h2>
    <div class="blocks" id="blocks"></div>
  </section>

  <section class="panel">
    <h2>Fabric needed</h2>
    <div class="fabgrid" id="yardage"></div>
    <p class="muted" id="yardnote"></p>
  </section>

  <section class="panel">
    <h2>Cut list</h2>
    <div id="cuts"></div>
  </section>

  <section class="panel">
    <h2>Sewing order</h2>
    <ol class="steps" id="steps"></ol>
  </section>
</div>

<script>
/* ================================================================
   Everything in the quilt is a rectangle on a grid. Each rectangle
   (a "cell") is filled one of five ways:
     solid  – one fabric
     split  – diagonal split, fabric A in one corner triangle
     goose  – flying goose: big triangle (goose) pointing a direction, two wings
     check  – n×n checkerboard
     block  – another grid (a block placed inside the quilt)
   All sizes are FINISHED inches. Seam allowance is added only for cutting.
   ================================================================ */

const DEFAULTS = {
  a: 2.25,   // corner block: brown corner squares; also side-block floral band depth
  c: 4.5,    // nine-patch size (corner + side blocks)
  s: 5,      // star block: floral corner squares (= star-point goose height)
  S: 10,     // star block: 4×4 center checkerboard
  b: 4.5,    // floral border width
  seam: 0.25,
  wof: 42,   // usable width of fabric
  colors: { floral: '#1f4fbf', brown: '#5a2d1a', cream: '#f6ecd9', black: '#1b1b1b' }
};
const FABRICS = { floral: 'Blue floral', brown: 'Chocolate brown', cream: 'Cream', black: 'Black' };
const PARAMS = [
  ['a', 'Corner block: brown corners', 'Also the depth of the floral bands in the side blocks'],
  ['c', 'Nine-patch', 'Center of corner & side blocks'],
  ['s', 'Star: floral corners', 'Also the height of the star-point geese'],
  ['S', 'Star: center checkerboard', '4 × 4 squares'],
  ['b', 'Floral border width', ''],
  ['seam', 'Seam allowance', ''],
  ['wof', 'Usable fabric width', 'For yardage math'],
];
const KEY = 'quiltstudio.v2';

let P = load();
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.p) return { ...DEFAULTS, ...s.p, colors: { ...DEFAULTS.colors, ...(s.p.colors || {}) } }; } catch (e) {}
  return structuredClone(DEFAULTS);
}
function loadDone() { try { return new Set(JSON.parse(localStorage.getItem(KEY))?.done || []); } catch (e) { return new Set(); } }
let DONE = loadDone();
function save() { try { localStorage.setItem(KEY, JSON.stringify({ p: P, done: [...DONE] })); } catch (e) {} }

/* ---------- helpers ---------- */
const sum = (arr, from = 0, n = arr.length) => arr.slice(from, from + n).reduce((x, y) => x + y, 0);
const EIGHTHS = ['', '⅛', '¼', '⅜', '½', '⅝', '¾', '⅞'];
function fmt(x) {
  const e = Math.round(x * 8);
  if (Math.abs(e / 8 - x) > 1e-6) return (+x.toFixed(3)) + '″';
  const w = Math.floor(e / 8), f = e % 8;
  return (w ? w : (f ? '' : '0')) + EIGHTHS[f] + '″';
}
const dim = (w, h) => `${fmt(w)} × ${fmt(h)}`;
const sw = f => `<span class="swatch fab-${f}"></span>`;

const solid = (f, name) => ({ t: 'solid', f, name });
const split = (A, B, corner) => ({ t: 'split', A, B, corner });
const goose = (g, w, dir) => ({ t: 'goose', g, w, dir });
const check = (n, A, B) => ({ t: 'check', n, A, B });
const cell = (x, y, fill, cs = 1, rs = 1) => ({ x, y, fill, cs, rs });

/* ---------- block definitions ---------- */
const cornerSize = () => 2 * P.a + P.c;
const starSize = () => 2 * P.s + P.S;
const splitW = () => (starSize() - P.c) / 4;
const topSize = () => 2 * cornerSize() + starSize() + 2 * P.b;

function cornerBlock() {
  const { a, c } = P, G = d => goose('floral', 'cream', d), B = solid('brown', 'corner square');
  return { id: 'corner', name: 'Corner block', cols: [a, c, a], rows: [a, c, a], cells: [
    cell(0, 0, B), cell(1, 0, G('down')), cell(2, 0, B),
    cell(0, 1, G('right')), cell(1, 1, check(3, 'black', 'cream')), cell(2, 1, G('left')),
    cell(0, 2, B), cell(1, 2, G('up')), cell(2, 2, B),
  ]};
}
function sideBlock() {
  const { a, c } = P, w = splitW(), band = solid('floral', 'side-block band');
  return { id: 'side', name: 'Side block', cols: [w, w, c, w, w], rows: [a, c, a], cells: [
    cell(0, 0, band, 5, 1),
    cell(0, 1, split('cream', 'brown', 'bl')), cell(1, 1, split('cream', 'brown', 'bl')),
    cell(2, 1, check(3, 'black', 'cream')),
    cell(3, 1, split('cream', 'brown', 'br')), cell(4, 1, split('cream', 'brown', 'br')),
    cell(0, 2, band, 5, 1),
  ]};
}
function starBlock() {
  const { s, S } = P, G = d => goose('floral', 'brown', d), F = solid('floral', 'star background square');
  return { id: 'star', name: 'Center star', cols: [s, S, s], rows: [s, S, s], cells: [
    cell(0, 0, F), cell(1, 0, G('down')), cell(2, 0, F),
    cell(0, 1, G('right')), cell(1, 1, check(4, 'black', 'cream')), cell(2, 1, G('left')),
    cell(0, 2, F), cell(1, 2, G('up')), cell(2, 2, F),
  ]};
}

/* rotate a block 90° clockwise, `times` times */
const ROT_CORNER = { tl: 'tr', tr: 'br', br: 'bl', bl: 'tl' };
const ROT_DIR = { up: 'right', right: 'down', down: 'left', left: 'up' };
function rotFill(f) {
  if (f.t === 'split') return { ...f, corner: ROT_CORNER[f.corner] };
  if (f.t === 'goose') return { ...f, dir: ROT_DIR[f.dir] };
  if (f.t === 'check' && f.n % 2 === 0) return { ...f, A: f.B, B: f.A };
  return f;
}
function rot(b, times) {
  for (let i = 0; i < times; i++) {
    const H = b.rows.length;
    b = { ...b, cols: b.rows.slice().reverse(), rows: b.cols.slice(),
      cells: b.cells.map(k => ({ x: H - k.y - k.rs, y: k.x, cs: k.rs, rs: k.cs, fill: rotFill(k.fill) })) };
  }
  return b;
}

function quiltLayout() {
  const K = cornerSize(), T = starSize(), b = P.b;
  const C = cornerBlock(), Sd = sideBlock(), St = starBlock();
  const B = (blk, r) => ({ t: 'block', block: rot(blk, r) });
  const strip = solid('floral', 'border strip'), sq = solid('floral', 'border end square');
  return { id: 'quilt', cols: [b, K, T, K, b], rows: [b, K, T, K, b], cells: [
    cell(0, 0, sq), cell(1, 0, strip, 3, 1), cell(4, 0, sq),
    cell(0, 1, strip, 1, 3), cell(4, 1, strip, 1, 3),
    cell(0, 4, sq), cell(1, 4, strip, 3, 1), cell(4, 4, sq),
    cell(1, 1, B(C, 0)), cell(2, 1, B(Sd, 0)), cell(3, 1, B(C, 1)),
    cell(1, 2, B(Sd, 3)), cell(2, 2, B(St, 0)), cell(3, 2, B(Sd, 1)),
    cell(1, 3, B(C, 3)), cell(2, 3, B(Sd, 2)), cell(3, 3, B(C, 2)),
  ]};
}

/* ---------- rendering (pure CSS shapes) ---------- */
const CLIP_SPLIT = { tl: '0 0,100% 0,0 100%', tr: '0 0,100% 0,100% 100%', br: '100% 0,100% 100%,0 100%', bl: '0 0,100% 100%,0 100%' };
const CLIP_GOOSE = { down: '0 0,100% 0,50% 100%', up: '0 100%,100% 100%,50% 0', left: '100% 0,100% 100%,0 50%', right: '0 0,0 100%,100% 50%' };

function renderGrid(b, el) {
  el.classList.add('g');
  el.style.gridTemplateColumns = b.cols.map(v => v + 'fr').join(' ');
  el.style.gridTemplateRows = b.rows.map(v => v + 'fr').join(' ');
  for (const k of b.cells) {
    const d = document.createElement('div');
    d.className = 'c';
    d.style.gridColumn = `${k.x + 1} / span ${k.cs}`;
    d.style.gridRow = `${k.y + 1} / span ${k.rs}`;
    renderFill(k.fill, d);
    el.append(d);
  }
  return el;
}
function renderFill(f, d) {
  if (f.t === 'block') { d.classList.add('blk'); renderGrid(f.block, d); return; }
  d.classList.add('leaf');
  if (f.t === 'solid') d.classList.add('fab-' + f.f);
  if (f.t === 'split' || f.t === 'goose') {
    const under = f.t === 'split' ? f.B : f.w, over = f.t === 'split' ? f.A : f.g;
    d.classList.add('fab-' + under);
    const i = document.createElement('i');
    i.className = 'fab-' + over;
    i.style.clipPath = `polygon(${f.t === 'split' ? CLIP_SPLIT[f.corner] : CLIP_GOOSE[f.dir]})`;
    d.append(i);
  }
  if (f.t === 'check') {
    const t = 200 / f.n;
    d.style.background = `repeating-conic-gradient(var(--${f.B}) 0 25%, var(--${f.A}) 0 50%) 0 0 / ${t}% ${t}%`;
  }
}
function renderBlockArt(b, cls = '') {
  const el = document.createElement('div');
  el.className = 'art ' + cls;
  el.style.aspectRatio = `${sum(b.cols)} / ${sum(b.rows)}`;
  return renderGrid(b, el);
}

/* ---------- counting units ---------- */
const k4 = x => x.toFixed(4);
function collect(b, out = { units: {}, blocks: {} }) {
  for (const k of b.cells) {
    const w = sum(b.cols, k.x, k.cs), h = sum(b.rows, k.y, k.rs), f = k.fill;
    if (f.t === 'block') { out.blocks[f.block.id] = (out.blocks[f.block.id] || 0) + 1; collect(f.block, out); continue; }
    const L = Math.max(w, h), S = Math.min(w, h);
    let key, u;
    if (f.t === 'solid') { key = `solid|${f.f}|${f.name}|${k4(L)}|${k4(S)}`; u = { t: 'solid', f: f.f, name: f.name, w: L, h: S }; }
    if (f.t === 'split') { key = `split|${[f.A, f.B].sort()}|${k4(L)}|${k4(S)}`; u = { t: 'split', A: f.A, B: f.B, w: L, h: S }; }
    if (f.t === 'goose') { key = `goose|${f.g}|${f.w}|${k4(L)}|${k4(S)}`; u = { t: 'goose', g: f.g, wing: f.w, w: L, h: S }; }
    if (f.t === 'check') { key = `check|${f.n}|${[f.A, f.B].sort()}|${k4(w)}`; u = { t: 'check', n: f.n, A: f.A, B: f.B, w, h }; }
    (out.units[key] ||= { ...u, qty: 0 }).qty++;
  }
  return out;
}
const isSquare = u => Math.abs(u.w - u.h) < 1e-6;
const is2to1 = u => Math.abs(u.w - 2 * u.h) < 1e-6;
const checkCounts = u => { const n2 = u.n * u.n; return [Math.ceil(n2 / 2), Math.floor(n2 / 2)]; };

function describe(u) {
  if (u.t === 'solid') return `${sw(u.f)}${cap(u.name)} — ${dim(u.w, u.h)}`;
  if (u.t === 'split') return `${sw(u.A)}${sw(u.B)}${isSquare(u) ? 'Half-square triangle' : 'Half-rectangle triangle'} (${FABRICS[u.A].toLowerCase()}/${FABRICS[u.B].toLowerCase()}) — ${dim(u.w, u.h)}`;
  if (u.t === 'goose') return `${sw(u.g)}${sw(u.wing)}Flying goose (${FABRICS[u.g].toLowerCase()} goose, ${FABRICS[u.wing].toLowerCase()} wings) — ${dim(u.w, u.h)}`;
  if (u.t === 'check') { const [a, b] = checkCounts(u); return `${sw(u.A)}${sw(u.B)}${u.n}×${u.n} checkerboard — ${fmt(u.w)} square (${a} ${FABRICS[u.A].toLowerCase()} + ${b} ${FABRICS[u.B].toLowerCase()}, ${fmt(u.w / u.n)} each)`; }
}
const cap = s => s[0].toUpperCase() + s.slice(1);

/* ---------- cutting ---------- */
function cutsFor(u, warn) {
  const s2 = 2 * P.seam, out = [];
  if (u.t === 'solid') out.push({ f: u.f, w: u.w + s2, h: u.h + s2, qty: u.qty, what: u.name });
  if (u.t === 'goose') {
    out.push({ f: u.g, w: u.w + s2, h: u.h + s2, qty: u.qty, what: `goose rectangles (${dim(u.w, u.h)} geese)` });
    out.push({ f: u.wing, w: u.h + s2, h: u.h + s2, qty: u.qty * 2, what: `wing squares, stitch-and-flip (${dim(u.w, u.h)} geese)` });
    if (!is2to1(u)) warn.push(`Geese ${dim(u.w, u.h)} are not 2:1, so stitch-and-flip won't give sharp points. Make the long side exactly twice the short side, or plan to paper-piece them.`);
  }
  if (u.t === 'split') {
    if (isSquare(u)) {
      const n = Math.ceil(u.qty / 2), z = u.w + 1;
      for (const f of [u.A, u.B]) out.push({ f, w: z, h: z, qty: n, what: `HST squares — 2-at-a-time, trim to ${fmt(u.w + s2)}` });
    } else {
      for (const f of [u.A, u.B]) out.push({ f, w: u.w + 1, h: u.h + 1, qty: u.qty, what: `HRT rectangles, oversized — trim to ${dim(u.w + s2, u.h + s2)}` });
      warn.push(`The ${dim(u.w, u.h)} triangle units aren't square, so they're half-rectangle triangles. Use an HRT ruler or paper-piece them. Fabric is budgeted generously (one oversized rectangle of each fabric per unit).`);
    }
  }
  if (u.t === 'check') {
    const [a, b] = checkCounts(u), z = u.w / u.n + s2;
    out.push({ f: u.A, w: z, h: z, qty: a * u.qty, what: `squares for ${u.n}×${u.n} checkerboards` });
    out.push({ f: u.B, w: z, h: z, qty: b * u.qty, what: `squares for ${u.n}×${u.n} checkerboards` });
  }
  return out;
}

/* strip-cut each size across the width of fabric; pick the orientation that uses the least length */
function stripInches(c) {
  const opt = (w, h) => { const per = Math.floor(P.wof / w); return per > 0 ? Math.ceil(c.qty / per) * h : Infinity; };
  const across = Math.min(opt(c.w, c.h), opt(c.h, c.w));
  if (across !== Infinity) return { inches: across, lengthwise: false };
  const L = Math.max(c.w, c.h), per = Math.max(1, Math.floor(P.wof / Math.min(c.w, c.h)));
  return { inches: Math.ceil(c.qty / per) * L, lengthwise: true };
}
const toYards = inches => Math.max(0.25, Math.ceil((inches * 1.1) / 36 * 8) / 8);
function yd(y) { const w = Math.floor(y), f = Math.round((y - w) * 8); return (w || (f ? '' : '0')) + (f ? EIGHTHS[f] : '') + ' yd'; }

/* ---------- page ---------- */
function buildControls() {
  document.getElementById('controls').innerHTML = PARAMS.map(([k, label, hint]) =>
    `<label class="field"><span>${label}${hint ? `<small>${hint}</small>` : ''}</span>
     <input type="number" step="0.125" min="0.125" data-k="${k}" value="${P[k]}"></label>`).join('');
  document.getElementById('colors').innerHTML = Object.entries(FABRICS).map(([k, label]) =>
    `<label class="field"><span>${label}</span><input type="color" data-c="${k}" value="${P.colors[k]}"></label>`).join('');
  document.querySelectorAll('[data-k]').forEach(i => i.addEventListener('input', () => {
    const v = parseFloat(i.value); if (v > 0) { P[i.dataset.k] = v; save(); render(); }
  }));
  document.querySelectorAll('[data-c]').forEach(i => i.addEventListener('input', () => {
    P.colors[i.dataset.c] = i.value; save(); applyColors();
  }));
}
function applyColors() { for (const [k, v] of Object.entries(P.colors)) document.documentElement.style.setProperty('--' + k, v); }

function render() {
  const Q = topSize(), K = cornerSize(), T = starSize();
  const bindIn = 0.375;
  document.getElementById('summary').innerHTML =
    `Finished quilt <b>${dim(Q, Q)}</b> · checkerboard binding (purchased) on the edge`;
  document.getElementById('derived').innerHTML = `
    <div><span>Corner block</span><b>${dim(K, K)}</b></div>
    <div><span>Side block</span><b>${dim(T, K)}</b></div>
    <div><span>Center star</span><b>${dim(T, T)}</b></div>
    <div><span>Center (3 × 3 blocks)</span><b>${dim(2 * K + T, 2 * K + T)}</b></div>
    <div><span>Whole top</span><b>${dim(Q, Q)}</b></div>`;

  // mockup
  const wrap = document.getElementById('bindingWrap');
  wrap.style.padding = (bindIn / (Q + 2 * bindIn) * 100) + '%';
  const q = document.getElementById('quilt');
  q.replaceChildren(); q.className = ''; q.style.aspectRatio = '1 / 1';
  const layout = quiltLayout();
  renderGrid(layout, q);
  document.getElementById('mock').classList.toggle('seams', document.getElementById('seams').checked);

  const all = collect(layout);
  const warn = [];

  // blocks
  const defs = [cornerBlock(), sideBlock(), starBlock()];
  const blocksEl = document.getElementById('blocks');
  blocksEl.replaceChildren();
  for (const b of defs) {
    const card = document.createElement('div');
    card.className = 'blockcard seams';
    card.innerHTML = `<h3>${b.name} <span class="tag">make ${all.blocks[b.id] || 0}</span></h3>
      <div class="muted">${dim(sum(b.cols), sum(b.rows))} finished · grid ${b.cols.map(fmt).join(' / ')} by ${b.rows.map(fmt).join(' / ')}</div>`;
    card.append(renderBlockArt(b, b.id === 'side' ? 'wide' : ''));
    const units = Object.values(collect(b).units);
    const ul = document.createElement('ul'); ul.className = 'units';
    ul.innerHTML = units.map(u => `<li>${u.qty} × ${describe(u)}</li>`).join('');
    card.append(document.createElement('div'));
    card.lastChild.innerHTML = '<div class="muted" style="margin-bottom:4px">Per block:</div>';
    card.append(ul);
    blocksEl.append(card);
  }

  // cuts + yardage
  const cuts = [];
  for (const u of Object.values(all.units)) cuts.push(...cutsFor(u, warn));
  const byFab = {};
  for (const c of cuts) {
    const key = `${c.f}|${k4(Math.max(c.w, c.h))}|${k4(Math.min(c.w, c.h))}|${c.what}`;
    const m = (byFab[c.f] ||= {});
    if (m[key]) m[key].qty += c.qty; else m[key] = { ...c, w: Math.max(c.w, c.h), h: Math.min(c.w, c.h) };
  }
  let cutHtml = '', yardHtml = '', anyLengthwise = false;
  for (const f of Object.keys(FABRICS)) {
    const list = Object.values(byFab[f] || {}).sort((x, y) => y.w * y.h - x.w * x.h);
    if (!list.length) continue;
    let inches = 0;
    const rows = list.map(c => { const s = stripInches(c); inches += s.inches; anyLengthwise ||= s.lengthwise;
      return `<tr><td class="n">${c.qty}</td><td>${dim(c.w, c.h)}</td><td>${c.what}${s.lengthwise ? ' <span class="tag">cut lengthwise</span>' : ''}</td></tr>`; }).join('');
    cutHtml += `<h3 style="margin-top:14px">${sw(f)}${FABRICS[f]}</h3>
      <table><thead><tr><th class="n">Qty</th><th>Cut size</th><th>For</th></tr></thead><tbody>${rows}</tbody></table>`;
    yardHtml += `<div class="panel"><div>${sw(f)}${FABRICS[f]}</div><div class="yard">${yd(toYards(inches))}</div>
      <div class="muted">${fmt(inches)} of strips</div></div>`;
  }
  const finW = Q + 8, panels = Math.ceil(finW / (P.wof - 2));
  const backing = Math.ceil(panels * finW / 36 * 8) / 8;
  const bindLen = 4 * Q + 12;
  yardHtml += `<div class="panel"><div>Backing</div><div class="yard">${yd(backing)}</div><div class="muted">${panels} width${panels > 1 ? 's' : ''} × ${fmt(finW)}, seamed</div></div>
    <div class="panel"><div>Batting</div><div class="yard">${dim(finW, finW)}</div><div class="muted">4″ extra all round</div></div>
    <div class="panel"><div>Checker binding</div><div class="yard">${yd(Math.ceil(bindLen / 36 * 8) / 8)}</div><div class="muted">${fmt(bindLen)} long (perimeter + 12″)</div></div>`;
  document.getElementById('yardage').innerHTML = yardHtml;
  document.getElementById('yardnote').textContent =
    `Quilt-top fabrics assume strips cut across a ${fmt(P.wof)} usable width, plus 10% for shrinkage and mistakes, rounded up to the nearest ⅛ yard.` +
    (anyLengthwise ? ' Some pieces are longer than the fabric width; they are counted as cut along the length.' : '');
  document.getElementById('cuts').innerHTML = cutHtml;

  document.getElementById('warnings').innerHTML = [...new Set(warn)].map(w => `<div class="warn">${w}</div>`).join('');

  renderSteps(all, Q, finW, bindLen);
}

function renderSteps(all, Q, finW, bindLen) {
  const U = Object.values(all.units);
  const n = (pred) => U.filter(pred).reduce((t, u) => t + u.qty, 0);
  const nine = n(u => u.t === 'check' && u.n === 3), big = n(u => u.t === 'check' && u.n === 4);
  const cg = U.find(u => u.t === 'goose' && u.wing === 'cream'), sg = U.find(u => u.t === 'goose' && u.wing === 'brown');
  const hr = U.find(u => u.t === 'split');
  const steps = [
    ['Prep', 'Prewash (optional) and press all fabric.'],
    ['Cut', 'Cut every piece in the cut list. Label the piles by size.'],
    ['Units', `Sew ${nine} nine-patches (${fmt(P.c)} finished), black in the corners and center.`],
    ['Units', `Sew ${big} 4 × 4 checkerboard (${fmt(P.S)} finished) for the star center.`],
    ['Units', `Make ${cg?.qty || 0} cream-wing flying geese (${cg ? dim(cg.w, cg.h) : ''}) for the corner blocks.`],
    ['Units', `Make ${sg?.qty || 0} brown-wing flying geese (${sg ? dim(sg.w, sg.h) : ''}): the star points.`],
    ['Units', `Make ${hr?.qty || 0} cream/brown triangle units (${hr ? dim(hr.w, hr.h) : ''}), half of them mirror images. Trim to size.`],
    ['Blocks', `Corner blocks ×${all.blocks.corner}: sew 3 rows (brown, goose, brown / goose, nine-patch, goose / brown, goose, brown), then join the rows. Geese point toward the center.`],
    ['Blocks', `Side blocks ×${all.blocks.side}: sew the middle row (2 triangle units, nine-patch, 2 mirrored units), then add a floral band above and below.`],
    ['Blocks', 'Center star: sew 3 rows (floral, goose, floral / goose, checkerboard, goose / floral, goose, floral), then join.'],
    ['Center', 'Lay out the 3 × 3 blocks: corners in the corners, side blocks turned so their floral bands run parallel to the outer edge, star in the middle. Sew 3 rows, then join the rows.'],
    ['Border', `Sew a floral border strip to the left and right sides.`],
    ['Border', `Sew a ${fmt(P.b)} floral square to each end of the other two strips, then sew them to the top and bottom. The top should measure ${dim(Q + 2 * P.seam, Q + 2 * P.seam)} unfinished.`],
    ['Finish', `Layer backing (${dim(finW, finW)}), batting, and top. Baste and quilt.`],
    ['Finish', `Trim, then bind with the checkerboard binding (${fmt(bindLen)}).`],
  ];
  const ol = document.getElementById('steps');
  ol.innerHTML = steps.map(([phase, text], i) => {
    const id = 's' + i + phase;
    return `<li><label><input type="checkbox" data-step="${id}" ${DONE.has(id) ? 'checked' : ''}> <span><span class="phase">${phase}.</span> ${text}</span></label></li>`;
  }).join('');
  ol.querySelectorAll('[data-step]').forEach(cb => cb.addEventListener('change', () => {
    cb.checked ? DONE.add(cb.dataset.step) : DONE.delete(cb.dataset.step); save();
  }));
}

document.getElementById('seams').addEventListener('change', render);
document.getElementById('reset').addEventListener('click', () => { P = structuredClone(DEFAULTS); save(); buildControls(); applyColors(); render(); });
buildControls(); applyColors(); render();
</script>
</body>
</html>
